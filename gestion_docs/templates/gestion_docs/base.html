<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MINDEF | Système GED{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #1a2a3a !important; }
        .stat-card { border-left: 5px solid #1a2a3a; transition: 0.3s; }
        .badge-secret { background-color: #d9534f; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark shadow-sm">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand mb-0 h1" href="{% url 'index' %}">🎖️ GED - MINISTÈRE DE LA DÉFENSE</a>
            {% if user.is_authenticated %}
            <div class="d-flex align-items-center">
                <span class="text-white me-3 small">Utilisateur : <strong>{{ user.username }}</strong></span>
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-danger shadow-sm">Déconnexion</button>
                </form>
            </div>
            {% endif %}
        </div>
    </nav>

    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} shadow-sm">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}
</body>
</html>
